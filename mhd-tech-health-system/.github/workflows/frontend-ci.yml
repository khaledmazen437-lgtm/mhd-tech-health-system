name: Frontend CI

on:
  push:
    paths:
      - "mode1-spirometer/frontend/**"
  pull_request:
    paths:
      - "mode1-spirometer/frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mode1-spirometer/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
